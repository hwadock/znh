<!DOCTYPE html>
<!-- ZNH 웹 빌드 템플릿 — 화면 가득(가로 16:9 게임), 휴대폰은 가로로 돌려 달라는 안내 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ZNH</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0908; overflow: hidden; touch-action: none; }
  #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0b0908; }
  #znh-load { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(60vw, 420px); color: #d9c9b8; font: 600 16px sans-serif; text-align: center; }
  #znh-bar { margin-top: 12px; height: 8px; background: #2a1d18; border-radius: 4px; overflow: hidden; }
  #znh-fill { height: 100%; width: 0%; background: #b3261e; }
  #znh-rotate { display: none; position: fixed; inset: 0; background: #0b0908; color: #e8dccf; font: 600 20px sans-serif; align-items: center; justify-content: center; text-align: center; z-index: 10; }
  @media (orientation: portrait) and (max-width: 900px) { #znh-rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="znh-load">불러오는 중…<div id="znh-bar"><div id="znh-fill"></div></div></div>
<div id="znh-rotate">휴대폰을 가로로 돌려 주세요</div>
<script>
  var buildUrl = "Build";
  var config = {
    dataUrl: buildUrl + "/m.data.unityweb",
    frameworkUrl: buildUrl + "/m.framework.js.unityweb",
    codeUrl: buildUrl + "/m.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "ZNH",
    productVersion: "0.1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  };
  var canvas = document.querySelector("#unity-canvas");
  var script = document.createElement("script");
  script.src = buildUrl + "/m.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.querySelector("#znh-fill").style.width = (100 * p) + "%";
    }).then(function (inst) {
      window.unityInstance = inst;
      document.querySelector("#znh-load").style.display = "none";
    }).catch(function (m) { document.querySelector("#znh-load").textContent = "불러오지 못했습니다: " + m; });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
